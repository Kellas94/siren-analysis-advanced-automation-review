name: Source review checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 verified during preparation
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 verified during preparation
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - run: node review/check-source.mjs
